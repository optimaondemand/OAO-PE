<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Words to Know · Mission: Move!</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@700;900&display=swap" rel="stylesheet">
<style>
  :root{--binary:#0E1C42;--bitstream:#55C8E8;--gold:#C7922C;--pink:#A53E97;
    --green:#76C043;--teal:#0E5568;--ink:#1b2440;--muted:#5b668a;--line:#e3e8f2;}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;color:var(--ink);background:#f4f8fd;padding:16px}
  .wrap{max-width:900px;margin:0 auto}
  .eyebrow{display:inline-flex;align-items:center;gap:7px;background:#fff3d6;color:#8a6418;
    font-weight:800;font-size:11.5px;letter-spacing:.14em;text-transform:uppercase;padding:6px 12px;border-radius:999px}
  h2{font-family:'Archivo',sans-serif;font-size:clamp(22px,4vw,30px);color:var(--binary);margin:10px 0 4px}
  .sub{color:var(--muted);font-size:14.5px;margin-bottom:16px;line-height:1.5}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:13px}
  .card{perspective:1000px;height:150px;cursor:pointer}
  .inner{position:relative;width:100%;height:100%;transition:transform .55s cubic-bezier(.2,.8,.2,1);
    transform-style:preserve-3d}
  .card.flip .inner{transform:rotateY(180deg)}
  .face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;
    border-radius:16px;padding:16px;display:flex;flex-direction:column;justify-content:center;
    border:1.5px solid var(--line)}
  .front{background:linear-gradient(155deg,#fff,#f3f8ff)}
  .front .term{font-family:'Archivo',sans-serif;font-weight:900;font-size:19px;color:var(--binary);line-height:1.1}
  .front .tap{margin-top:auto;font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--bitstream);font-weight:800}
  .front .st{position:absolute;top:12px;right:12px;font-size:9.5px;font-weight:800;letter-spacing:.08em;
    text-transform:uppercase;color:#fff;background:var(--pink);padding:3px 7px;border-radius:999px}
  .back{background:linear-gradient(155deg,#0E1C42,#15295c);color:#eaf2ff;transform:rotateY(180deg)}
  .back .def{font-size:13.5px;line-height:1.5}
  .back .term2{font-weight:800;color:var(--bitstream);font-size:12.5px;margin-bottom:6px;text-transform:uppercase;letter-spacing:.06em}
  .prog{margin-top:14px;font-size:13px;color:var(--teal);font-weight:700}
</style>
</head>
<body>
<div class="wrap">
  <span class="eyebrow">🎯 Words to Know · Flip to Study</span>
  <h2>Sport Scientist Vocabulary</h2>
  <p class="sub">Tap a card to flip it. These are the terms you'll use all year — the ones marked <b>stretch</b> are the ones that make your writing sound like a real sport scientist.</p>
  <div class="grid" id="grid"></div>
  <div class="prog" id="prog">Cards explored: 0 / 7</div>
</div>
<script>
  var V=[
    {t:'Physical activity',d:'Any movement that uses your muscles and burns energy.'},
    {t:'Cardiovascular system',d:'Heart, blood, and vessels — the body’s oxygen delivery network.'},
    {t:'Resting heart rate',d:'How many times your heart beats per minute at rest. Lower usually means a fitter heart.'},
    {t:'Endorphins',d:'Brain chemicals released during exercise that improve mood and dull pain.'},
    {t:'BDNF',d:'Brain-derived neurotrophic factor — a protein released by exercise that helps brain cells grow.',s:1},
    {t:'VO₂ max',d:'The maximum amount of oxygen your body can use during all-out exercise.',s:1},
    {t:'Baseline',d:'A starting measurement used to compare future results.',s:1}
  ];
  var grid=document.getElementById('grid'),seen={};
  V.forEach(function(v,i){
    var c=document.createElement('div');c.className='card';c.tabIndex=0;
    c.innerHTML='<div class="inner">'+
      '<div class="face front">'+(v.s?'<span class="st">Stretch</span>':'')+
        '<div class="term">'+v.t+'</div><div class="tap">Tap to flip →</div></div>'+
      '<div class="face back"><div class="term2">'+v.t+'</div><div class="def">'+v.d+'</div></div>'+
      '</div>';
    function flip(){c.classList.toggle('flip');if(!seen[i]){seen[i]=1;
      document.getElementById('prog').textContent='Cards explored: '+Object.keys(seen).length+' / '+V.length;
      if(Object.keys(seen).length===V.length)document.getElementById('prog').textContent='✓ All '+V.length+' terms explored — nice work, scientist!';}}
    c.addEventListener('click',flip);
    c.addEventListener('keydown',function(e){if(e.key==='Enter'||e.key===' '){e.preventDefault();flip();}});
    grid.appendChild(c);
  });
</script>
</body>
</html>
