<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Mission: Move! — Sport Scientist Intro</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --binary:#0E1C42; --bitstream:#55C8E8; --gold:#C7922C;
    --purple:#67308F; --pink:#A53E97; --green:#76C043; --orange:#F78F1E;
    --ink:#eaf2ff;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;
    background:
      radial-gradient(1200px 500px at 80% -10%, rgba(85,200,232,.22), transparent 60%),
      radial-gradient(900px 500px at 10% 120%, rgba(165,62,151,.25), transparent 55%),
      linear-gradient(160deg,#0a1636 0%, #0E1C42 55%, #0b1a3f 100%);
    color:var(--ink);
    overflow:hidden;
  }
  /* faint grid — "mission control" */
  .grid{
    position:fixed;inset:0;z-index:0;opacity:.35;
    background-image:
      linear-gradient(rgba(85,200,232,.08) 1px,transparent 1px),
      linear-gradient(90deg,rgba(85,200,232,.08) 1px,transparent 1px);
    background-size:44px 44px;
    -webkit-mask-image:radial-gradient(circle at 50% 40%, #000 55%, transparent 100%);
            mask-image:radial-gradient(circle at 50% 40%, #000 55%, transparent 100%);
    animation:drift 24s linear infinite;
  }
  @keyframes drift{from{background-position:0 0,0 0}to{background-position:44px 88px,88px 44px}}

  .wrap{position:relative;z-index:2;min-height:100%;display:flex;flex-direction:column;
    align-items:center;justify-content:center;padding:34px 20px;text-align:center}

  .badge{
    display:inline-flex;align-items:center;gap:8px;
    background:rgba(165,62,151,.18);border:1px solid rgba(165,62,151,.55);
    color:#ffd7f3;padding:7px 15px;border-radius:999px;
    font-size:12.5px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;
    opacity:0;transform:translateY(12px);animation:rise .7s .15s forwards cubic-bezier(.2,.8,.2,1)}
  .badge .rocket{display:inline-block;animation:float 2.6s ease-in-out infinite}
  @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}

  h1{
    font-family:'Archivo',sans-serif;font-weight:900;letter-spacing:-.02em;line-height:.95;
    font-size:clamp(40px,10vw,86px);margin:14px 0 6px;
    background:linear-gradient(100deg,#ffffff 10%, var(--bitstream) 55%, #bfe9f7 90%);
    -webkit-background-clip:text;background-clip:text;color:transparent;
    text-shadow:0 2px 40px rgba(85,200,232,.25);
    opacity:0;transform:translateY(16px) scale(.98);
    animation:rise .8s .3s forwards cubic-bezier(.2,.8,.2,1)}
  h1 .move{display:inline-block;color:transparent}
  .tag{
    font-size:clamp(14px,2.6vw,19px);font-weight:700;color:#cfe6ff;letter-spacing:.02em;
    opacity:0;transform:translateY(14px);animation:rise .8s .5s forwards cubic-bezier(.2,.8,.2,1)}
  .tag b{color:var(--gold)}

  /* EKG heartbeat line */
  .ekg{width:min(640px,92vw);height:62px;margin:16px 0 6px;overflow:visible}
  .ekg path{
    fill:none;stroke:url(#eg);stroke-width:3.2;stroke-linecap:round;stroke-linejoin:round;
    filter:drop-shadow(0 0 6px rgba(85,200,232,.8));
    stroke-dasharray:1200;stroke-dashoffset:1200;
    animation:draw 2.4s .7s forwards ease-out, pulse 2.4s 3.2s infinite ease-in-out}
  @keyframes draw{to{stroke-dashoffset:0}}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.55}}
  .blip{opacity:0;animation:blip 2.4s 3.2s infinite}
  @keyframes blip{0%,42%{opacity:0;offset-distance:0%}46%{opacity:1}50%,100%{opacity:0}}

  .stats{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;margin-top:12px;
    opacity:0;animation:rise .8s .9s forwards cubic-bezier(.2,.8,.2,1)}
  .stat{
    background:rgba(255,255,255,.055);border:1px solid rgba(255,255,255,.14);
    border-radius:14px;padding:12px 16px;min-width:132px;backdrop-filter:blur(3px)}
  .stat .num{font-family:'Archivo',sans-serif;font-weight:900;font-size:26px;color:#fff;line-height:1}
  .stat .num .u{font-size:13px;color:var(--bitstream);font-weight:700;margin-left:3px}
  .stat .lbl{font-size:11.5px;letter-spacing:.09em;text-transform:uppercase;color:#9fb6d8;margin-top:6px}

  .cta{margin-top:20px;display:flex;align-items:center;gap:10px;color:#bcd3f1;font-weight:700;
    font-size:13.5px;letter-spacing:.06em;text-transform:uppercase;
    opacity:0;animation:rise .8s 1.15s forwards cubic-bezier(.2,.8,.2,1)}
  .chev{width:30px;height:30px;border-radius:50%;border:1px solid rgba(188,211,241,.5);
    display:grid;place-items:center;animation:bob 1.8s ease-in-out infinite}
  .chev svg{stroke:#bcd3f1}
  @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(5px)}}

  @keyframes rise{to{opacity:1;transform:none}}

  /* floating fitness glyphs */
  .float{position:fixed;z-index:1;opacity:.14;font-size:34px;animation:wander linear infinite}
  .f1{left:7%;top:22%;animation-duration:17s}
  .f2{right:9%;top:30%;font-size:28px;animation-duration:21s;animation-direction:reverse}
  .f3{left:14%;bottom:16%;font-size:30px;animation-duration:19s}
  .f4{right:13%;bottom:20%;font-size:32px;animation-duration:23s;animation-direction:reverse}
  @keyframes wander{0%{transform:translateY(0) rotate(0)}50%{transform:translateY(-16px) rotate(8deg)}100%{transform:translateY(0) rotate(0)}}

  @media (prefers-reduced-motion: reduce){
    *{animation:none!important}
    .badge,.tag,.stats,.cta,h1{opacity:1!important;transform:none!important}
    .ekg path{stroke-dashoffset:0}
  }
</style>
</head>
<body>
  <div class="grid"></div>
  <span class="float f1">🏃</span>
  <span class="float f2">💪</span>
  <span class="float f3">❤️</span>
  <span class="float f4">🫁</span>

  <div class="wrap">
    <span class="badge"><span class="rocket">🚀</span> Flight Club · Mission Briefing</span>
    <h1>MISSION:&nbsp;<span class="move">MOVE!</span></h1>
    <div class="tag">6th Grade PE &nbsp;·&nbsp; You are now a <b>Sport Scientist in Training</b></div>

    <svg class="ekg" viewBox="0 0 640 62" preserveAspectRatio="none" aria-hidden="true">
      <defs>
        <linearGradient id="eg" x1="0" y1="0" x2="1" y2="0">
          <stop offset="0" stop-color="#A53E97"/>
          <stop offset=".5" stop-color="#55C8E8"/>
          <stop offset="1" stop-color="#76C043"/>
        </linearGradient>
      </defs>
      <path d="M0,31 L150,31 L175,31 L188,10 L205,54 L222,31 L250,31 L420,31 L446,31 L459,10 L476,54 L493,31 L520,31 L640,31"/>
    </svg>

    <div class="stats">
      <div class="stat"><div class="num"><span data-to="60">0</span><span class="u">min/day</span></div><div class="lbl">Your mission dose</div></div>
      <div class="stat"><div class="num"><span data-to="100000" data-comma="1">0</span></div><div class="lbl">Heartbeats a day</div></div>
      <div class="stat"><div class="num"><span data-to="206">0</span></div><div class="lbl">Bones to train</div></div>
    </div>

    <div class="cta">Scroll to begin your mission
      <span class="chev"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg></span>
    </div>
  </div>

<script>
  // count-up stats
  function run(){
    document.querySelectorAll('[data-to]').forEach(function(el){
      var to=+el.dataset.to, comma=el.dataset.comma, start=null, dur=1400;
      function step(t){
        if(!start)start=t;
        var p=Math.min((t-start)/dur,1);
        var e=1-Math.pow(1-p,3);
        var v=Math.round(to*e);
        el.textContent=comma?v.toLocaleString():v;
        if(p<1)requestAnimationFrame(step);
      }
      requestAnimationFrame(step);
    });
  }
  if(window.matchMedia('(prefers-reduced-motion: reduce)').matches){
    document.querySelectorAll('[data-to]').forEach(function(el){
      el.textContent=el.dataset.comma?(+el.dataset.to).toLocaleString():el.dataset.to;});
  }else{ setTimeout(run,950); }
</script>
</body>
</html>
